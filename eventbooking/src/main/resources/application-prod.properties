# ===== DATABASE =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/event_booking_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Không tự sửa schema trên prod
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ===== MAIL =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== JWT =====
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${ACCESS_TOKEN_MS:1800000}
app.jwt.refresh-token-expiration-ms=${REFRESH_TOKEN_MS:604800000}

# ===== RESET PASSWORD =====
app.password.base-url=${FE_RESET_URL:https://your-domain.com/reset-password}
